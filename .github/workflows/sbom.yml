name: SBOM
# NOTE: `release: published` does NOT fire for releases created by another
# workflow using GITHUB_TOKEN (GitHub's workflow-recursion guard) — which
# is exactly how release.yml publishes. That left every release since
# v0.7.55 without an SBOM asset. release.yml therefore calls this workflow
# directly (workflow_call) after publishing; the release trigger stays for
# manually-published releases, and workflow_dispatch(tag) backfills.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Tag whose release gets the SBOM asset"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose release gets the SBOM asset (backfill)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SBOM must describe the released tree, not default-branch HEAD.
          ref: ${{ inputs.tag || github.ref }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: sbom.cdx.json
          tag_name: ${{ inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
