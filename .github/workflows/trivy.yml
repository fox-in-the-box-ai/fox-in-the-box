name: Trivy Container Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  # On-demand re-scan — e.g. right after :stable advances, so the
  # code-scanning alert set reflects the new image without waiting for
  # the next push or the Monday cron.
  workflow_dispatch: {}

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan container image
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull :stable image
        run: docker pull ghcr.io/fox-in-the-box-ai/cloud:stable

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/fox-in-the-box-ai/cloud:stable
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Trivy summary (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/fox-in-the-box-ai/cloud:stable
          format: table
          severity: CRITICAL,HIGH

      # Blocking gate (#897b): a fixable CRITICAL/HIGH must not ship.
      # Under Option B + promote-container, :stable and :vX.Y.Z point at the
      # SAME digest, so scanning :stable here gates the released image. The
      # SARIF feed above (exit-code: 0) stays the full passive alert stream;
      # this step is the one that fails the build.
      #   - ignore-unfixed: true is load-bearing — without it the ~104 unfixed
      #     Debian CVEs (no vendor patch available) would red every run.
      #   - .trivyignore carries the curated accepted-until-upstream set
      #     (fixable findings we cannot remediate at a real control point yet),
      #     each with a justification + tracking note.
      # NOTE: this becomes truly green only once the remediated :stable is
      # published; sequence the blocking enforcement after that image ships.
      - name: Trivy gate — fail on fixable CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/fox-in-the-box-ai/cloud:stable
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
