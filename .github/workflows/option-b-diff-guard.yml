name: Option B diff guard

# Enforces the Option B contract documented in CLAUDE.md + docs/architecture/
# upstream-overlay.md: a PR whose title (or, after squash-merge, whose commit
# subject) starts with `bump(upstream):` may ONLY touch the upstream submodule
# pointers and the versions.toml that pins them. Any other file change in a
# bump(upstream) PR would silently ship arbitrary Fox code to :stable via the
# auto-bump in build-container.yml — which is what FITB#122 forbade and the
# v0.7.5 audit (per the engineering plan) flagged as the only remaining hole
# in the auto-bump trust model.
#
# Failure mode this closes: a Fox-code PR is squash-merged with a typo'd or
# copy-pasted "bump(upstream): …" subject line. build-container.yml's merge
# job sees the subject match its `^bump\(upstream\):` regex, retags :stable
# to the new digest, and every DMG/exe user's next launch pulls the unintended
# Fox-code change as a "stable" upgrade.
#
# Second job `freeze` (Release-freeze guard): during a declared release-freeze
# window — signalled by a `.release-freeze` marker file at the repo root of
# origin/main — no `bump(upstream):` PR may merge, because the Option B
# auto-bump would re-tag :stable from a :latest manifest carrying unreleased
# Fox-code changes ahead of the release tag. The marker is always read from
# origin/main AT RUN TIME (never the PR's stale base), and is lifted by a
# post-tag PR that deletes the file. Both jobs are required status checks on
# main with "require branches to be up to date" (strict), so a bump PR opened
# before the freeze landed cannot merge on a stale pre-freeze run. See
# docs/RELEASE_WORKFLOW.md → "Release-freeze windows".

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.title, 'bump(upstream):')
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert diff touches only upstream-pin files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Allowed paths for an Option B PR. Any change outside this list is
          # a violation. Notes:
          # - The two submodule pointers (gitlink entries) live at top level
          #   under `forks/`. Their content changes are gitlink-only — the
          #   submodule SHA in the parent tree changes; the file MODE is
          #   160000 (submodule), not a regular file edit.
          # - `packages/fox-overlay/` is the overlay package — patches,
          #   runtime monkey-patches, tests, scripts, and versions.toml are
          #   all mechanically coupled to the upstream version and must be
          #   updated alongside the submodule pointer bump.
          # - `packages/integration/requirements.lock` is the pip constraints
          #   file regenerated when upstream dependency pins change.
          # - This workflow file itself may need updating when the set of
          #   allowed paths evolves alongside upstream bumps.
          ALLOWED_RE='^(forks/hermes-(agent|webui)$|packages/(fox-overlay/|integration/requirements\.lock$)|\.github/workflows/option-b-diff-guard\.yml$)'

          changed=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA")
          echo "----- Changed files in this Option B PR -----"
          echo "$changed"
          echo "---------------------------------------------"

          violations=$(echo "$changed" | grep -Ev "$ALLOWED_RE" || true)
          if [ -n "$violations" ]; then
            echo "::error::Option B violation. A PR titled 'bump(upstream): …' must touch ONLY the upstream submodule pointers, packages/fox-overlay/, and this guard workflow. The following files are out-of-bounds for an Option B PR:"
            # Per-line prefix on a multiline var; ${var//} has no per-line form.
            # shellcheck disable=SC2001
            echo "$violations" | sed 's/^/::error::  - /'
            echo "::error::If this PR is supposed to include Fox-code changes, rename it to drop the 'bump(upstream):' prefix. If the auto-bump should apply but you also need a code change, split into two PRs."
            exit 1
          fi

          echo "✅ Option B contract satisfied — diff is upstream-pin-only."

  # Release-freeze guard. Skipped (green) on non-bump PRs — same title gate as
  # `guard` above, so the required check context always resolves. On
  # bump(upstream): PRs it fails iff `.release-freeze` exists on origin/main
  # at run time.
  freeze:
    # No `name:` on purpose — the required status-check context must be the
    # job id `freeze` (branch protection lists it verbatim, like `guard`).
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.title, 'bump(upstream):')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fail if a release freeze is active on origin/main
        run: |
          set -euo pipefail
          # Always evaluate against origin/main AS OF NOW — never the PR's
          # (potentially stale) base ref. A bump PR opened before the freeze
          # landed must still see the marker.
          git fetch --depth=1 origin main
          if git cat-file -e origin/main:.release-freeze 2>/dev/null; then
            echo "::error::A release freeze is active — no 'bump(upstream):' PR may merge until the freeze is lifted (post-tag PR deletes .release-freeze). Marker on origin/main:"
            git cat-file -p origin/main:.release-freeze | sed 's/^/::error::  /'
            exit 1
          fi
          echo "✅ No release freeze active on origin/main — bump(upstream) merges are allowed."
