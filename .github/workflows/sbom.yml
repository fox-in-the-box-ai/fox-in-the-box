name: SBOM
# NOTE: `release: published` does NOT fire for releases created by another
# workflow using GITHUB_TOKEN (GitHub's workflow-recursion guard) — which
# is exactly how release.yml publishes. That left every release after
# v0.7.55 (i.e. v0.7.56 onward) without an SBOM asset. release.yml therefore calls this workflow
# directly (workflow_call) after publishing; the release trigger stays for
# manually-published releases, and workflow_dispatch(tag) backfills.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Tag whose release gets the SBOM asset"
        required: true
        type: string
      image_digest:
        description: "Index digest (sha256:...) of the released multi-arch image; the SBOM is generated against this exact object"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose release gets the SBOM asset (backfill)"
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run against a nonexistent release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # action-gh-release CREATES a release when tag_name has none —
          # a typo'd backfill tag would silently mint a stray public
          # release. Fail loud instead.
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released image digest (fail loud if absent)
        id: img
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cloud
          TAG: ${{ inputs.tag || github.ref_name }}
          PASSED_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if [[ -n "$PASSED_DIGEST" ]]; then
            DIGEST="$PASSED_DIGEST"                       # release path: exact bytes from wait-for-container
          else
            # Backfill / manual path: resolve the index digest from the tag.
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
              --format '{{json .Manifest}}' | jq -r '.digest')
          fi
          if [[ -z "$DIGEST" || "$DIGEST" == "null" ]]; then
            echo "::error::No published image for ${IMAGE}:${TAG} — refusing to emit a non-image SBOM (#898)."
            exit 1
          fi
          echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # Scan the shipped multi-arch image by immutable index digest, not
          # the source tree (#898). syft resolves the index to the runner's
          # platform (linux/amd64); this asset therefore reflects the amd64
          # image. OS + Python layers are arch-identical; only the bundled
          # binaries differ by arch. Per-arch SBOMs tracked as a follow-up.
          image: ${{ steps.img.outputs.ref }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # Suppress sbom-action's built-in release-asset upload, which would
          # attach its own `fox-in-the-box-sbom.cyclonedx.json` alongside the
          # deliberate `sbom.cdx.json` below — every release since v0.7.61
          # carried the SBOM twice (#830). The softprops step is the canonical
          # attach path, targeting the right tag on the workflow_call /
          # manual-release / workflow_dispatch-backfill triggers via `tag_name`.
          upload-release-assets: false

      - name: Assert the SBOM describes the image, not the source tree (#898)
        run: |
          set -euo pipefail
          jq -e '.metadata.component.type == "container"' sbom.cdx.json >/dev/null \
            || { echo "::error::SBOM metadata.component.type is not 'container' — it is describing the source tree (regression of #898)."; exit 1; }
          for eco in "pkg:deb" "pkg:pypi"; do
            n=$(jq --arg e "$eco" '[.components[]?.purl // "" | select(startswith($e))] | length' sbom.cdx.json)
            [[ "$n" -gt 0 ]] || { echo "::error::SBOM contains 0 ${eco} components — not an image SBOM (regression of #898)."; exit 1; }
          done
          echo "SBOM describes the image: container component + deb + pypi present."
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: sbom.cdx.json
          tag_name: ${{ inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
