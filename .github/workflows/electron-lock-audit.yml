name: Electron lockfile audit

# Compensating control (#861). Collapsing the dependabot npm scopes (#856)
# removed the per-directory scan of packages/electron/package-lock.json — the
# npm lockfile that pins the transitive tree of the code-signed Windows .exe
# (build-electron.yml installs it with `npm ci`). The root pnpm scope does
# not regenerate that npm lock, and lockfile-consistency.yml (#806) only checks
# lock<->manifest sync, not advisories — so after #856 nothing else scans it for
# known CVEs. This job scans that ONE lockfile against the OSV database and
# fails on HIGH/CRITICAL (CVSS >= 7.0), matching the Trivy/CodeQL fail-on-high
# posture. #850 keeps the js-yaml split intact, so it does not close this gap.
#
# PERMANENT control (#861), not interim. packages/electron/package-lock.json has
# NO dependabot version-update coverage by design (the #856 dedup kept the
# electron manifest held on the workspace-wide npm scope, and #850's split does
# not restore per-lockfile advisory scanning) — this OSV scan is that lockfile's
# standing CVE coverage. Response protocol when it fires:
#   - In-range fix available: bump the transitive pin by regenerating the lock
#     with `(cd packages/electron && npm install --package-lock-only)`, then run
#     a build to confirm the tree still resolves.
#   - No in-range fix: bump the offending direct dependency in
#     packages/electron/package.json (the direct-dep bump path), then regenerate.
#
# NOTE: keep this OFF branch protection's required-check list while it carries a
# paths filter. A path-filtered required check never reports on a PR that misses
# the filter and hangs that PR forever (see lockfile-consistency.yml's rationale
# for why the hard gates run unconditionally instead).

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/electron/package-lock.json'
      - 'packages/electron/package.json'
  schedule:
    # Weekly, so a newly disclosed CVE against the pinned tree surfaces even
    # when no PR is touching the electron lockfile.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: electron-lock-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Scan electron npm lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner on packages/electron/package-lock.json
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          # Scope to the single npm lockfile — cheap, and the only tree this
          # gate is responsible for. JSON output is graded by the next step.
          scan-args: |-
            --output=osv-results.json
            --format=json
            --lockfile=packages/electron/package-lock.json

      - name: Fail on a genuine scanner error
        if: ${{ steps.scan.outcome == 'failure' }}
        run: |
          set -euo pipefail
          # osv-scanner exits non-zero BOTH when it finds vulnerabilities (graded
          # by the severity gate below) and when the scan itself fails. A failed
          # scan writes no results, so an empty/missing file here means the
          # scanner broke — fail loud rather than silently passing the PR.
          if [ ! -s osv-results.json ]; then
            echo "::error::OSV-Scanner failed without writing results — see the scan step log."
            exit 1
          fi

      - name: Gate on HIGH/CRITICAL advisories
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          THRESHOLD = 7.0  # CVSS v3: HIGH starts at 7.0, CRITICAL at 9.0.
          results = pathlib.Path("osv-results.json")
          if not results.is_file() or results.stat().st_size == 0:
              print("No results file — no known advisories in the electron lockfile.")
              sys.exit(0)

          data = json.loads(results.read_text() or "{}")
          blocking, unscored = [], []
          for result in data.get("results", []):
              for pkg in result.get("packages", []):
                  meta = pkg.get("package", {})
                  name, ver = meta.get("name", "?"), meta.get("version", "?")
                  for grp in pkg.get("groups", []):
                      ids = ",".join(grp.get("ids", []))
                      try:
                          score = float(grp.get("max_severity", ""))
                      except (TypeError, ValueError):
                          unscored.append((name, ver, ids))
                          continue
                      if score >= THRESHOLD:
                          blocking.append((name, ver, ids, score))

          for name, ver, ids in unscored:
              print(f"::warning::unscored advisory (no CVSS) in {name}@{ver}: {ids}")

          if blocking:
              print("HIGH/CRITICAL advisories in packages/electron/package-lock.json:")
              for name, ver, ids, score in blocking:
                  print(f"  {name}@{ver}  CVSS {score}  {ids}")
              print(f"::error::{len(blocking)} HIGH/CRITICAL advisory group(s) found (CVSS >= {THRESHOLD}).")
              sys.exit(1)

          print("No HIGH/CRITICAL advisories (CVSS >= 7.0) in the electron lockfile.")
          PY

  # Weekly cron failures are silent — on a scheduled run there is no PR check
  # to go red, so a broken osv scan or a real HIGH/CRITICAL find just sits in
  # the Actions tab (#877). Same pattern as playwright.yml's cron_health /
  # build-container's main_push_health (#752): open or re-fire one rolling
  # ci-health issue when the scheduled audit fails. PRs already surface the
  # red check, so this is schedule-only.
  cron_health:
    name: cron failure handler
    needs: [audit]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or re-fire the rolling ci-health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/tripwire-common.sh
          title="[cron] Electron lockfile OSV audit failed (rolling)"
          body=$(cat <<BODY_EOF
          ## The weekly electron-lockfile OSV audit failed or was cancelled

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          On a scheduled run there is no PR check to go red, so this issue is the
          only signal. Two causes:
            - A genuine scanner error (osv DB fetch failure, action rot, runner
              blip) — the scan wrote no results.
            - A real HIGH/CRITICAL advisory (CVSS >= 7.0) against
              packages/electron/package-lock.json with no PR touching it.

          ## Resolution
          - Open the run, read the "Gate on HIGH/CRITICAL advisories" step.
          - Real advisory, in-range fix: regenerate the lock with
            \`(cd packages/electron && npm install --package-lock-only)\`, then build.
          - Real advisory, no in-range fix: bump the offending direct dependency
            in packages/electron/package.json, then regenerate.
          - Transient scanner error: \`gh run rerun <id> --failed\`.
          - Close once a scheduled run is green.
          BODY_EOF
          )
          tripwire_fire "$title" "$body" "ci-health,P2"
