version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Single npm scope for the whole pnpm workspace. The root pnpm-lock.yaml
  # already resolves every workspace member (packages/electron, qa/playwright),
  # so this one scope covers them all in ONE grouped PR per run. The separate
  # /packages/electron and /qa/playwright scopes were removed (#856): they
  # re-scanned member manifests the root scope already owns, so each run
  # produced 2-3 PRs racing to edit the same package.json lines.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-deps:
        patterns: ["*"]
        # electron stays out of grouped bumps: a grouped PR once changed
        # packages/electron/package.json to a new electron MAJOR while
        # regenerating only the pnpm lockfile (#788 -> #806 incident),
        # silently promoting a runtime major and breaking npm ci.
        # Ungrouped, an electron update arrives as its own clearly-named
        # PR that can be held for the packaged-smoke arc (#750/#802
        # pattern). electron-builder is excluded for the same reason:
        # packaging breakage is invisible to PR CI (no job builds
        # installers) and surfaces only at release time. These excludes
        # must stay on the workspace-wide scope so the electron manifest
        # is still held here now that the per-directory scope is gone.
        exclude-patterns: ["electron", "electron-builder"]

  - package-ecosystem: pip
    directory: /packages/fox-overlay
    schedule:
      interval: weekly
    groups:
      overlay-deps:
        patterns: ["*"]
