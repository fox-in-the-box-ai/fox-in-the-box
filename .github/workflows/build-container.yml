# .github/workflows/build-container.yml
name: Build Container

# Multi-arch (linux/amd64 + linux/arm64) container build using the
# cross-runner pattern: each platform builds natively on its own runner
# (no QEMU emulation), per-platform digests are exported as artifacts,
# and a final merge job assembles the manifest list with
# `docker buildx imagetools create`. Native arm64 runners are GA and
# free for public repos. Issue #82.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: >-
          Index (manifest-list) digest of the pushed image. Pulling
          `name@<digest>` from any platform auto-selects the matching
          child manifest, so callers (release.yml) consume this exactly
          like the single-platform digest from before #82.
        value: ${{ jobs.merge.outputs.digest }}

env:
  IMAGE: ghcr.io/fox-in-the-box-ai/cloud

jobs:
  # ── Build per platform, push by digest, export the digest as an artifact.
  # No tag is written at this stage — tagging happens in the merge job once
  # both per-platform manifests are confirmed pushed. Cache scopes are
  # explicitly per-platform to prevent any chance of cross-arch layer
  # contamination (#82 reviewer concern).
  build:
    name: Build & Push (${{ matrix.platform.short }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,    short: amd64, full: linux/amd64 }
          - { runner: ubuntu-24.04-arm, short: arm64, full: linux/arm64 }
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Phase 8 follow-up #246: fail fast if any overlay artefact is stale
      # against the current submodule pin. Catches upstream rename/delete
      # of .fox-removals entries + anchor drift in the webui/agent patch
      # series BEFORE the Docker build wastes ~3 minutes per arch only to
      # die at git apply --check inside the container.
      - name: Overlay basis sanity check
        run: ./packages/fox-overlay/scripts/check-overlay-basis.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Determine FITB_VERSION
        id: meta
        run: |
          # Tag pushes use the version tag verbatim. Other events (push to
          # main, PRs) carry a dev marker derived from the short SHA so the
          # in-app version display is never blank — previously these built
          # with FITB_VERSION="" which surfaced as empty version strings on
          # :latest / :stable images. FITB#122 cosmetic.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "fitb_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
            echo "fitb_version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
          RUNTIME_VERSION=$(grep '^hermes_webui_tag' packages/fox-overlay/versions.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "runtime_version=${RUNTIME_VERSION:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packages/integration/Dockerfile
          platforms: ${{ matrix.platform.full }}
          # `push-by-digest=true` writes the image to the registry without
          # creating a tag — the merge job tags it once both arches are
          # confirmed. `name-canonical=true` ensures the resulting digest
          # is verifiable at name@sha256:... pull time.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-platform cache scopes — distinct keys so amd64 and arm64
          # never read each other's cache layers (reviewer concern #3).
          cache-from: type=gha,scope=cloud-${{ matrix.platform.short }}
          cache-to:   type=gha,scope=cloud-${{ matrix.platform.short }},mode=max
          build-args: |
            FITB_VERSION=${{ steps.meta.outputs.fitb_version }}
            FITB_RUNTIME_VERSION=${{ steps.meta.outputs.runtime_version }}

      - name: Export per-platform digest as artifact
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          if [[ -z "$digest" ]]; then
            echo "::error::build-push-action did not return a digest for ${{ matrix.platform.full }}"
            exit 1
          fi
          # Filename is the digest sans the sha256: prefix; merge job
          # globs these and prefixes name@sha256: at imagetools-create time.
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.platform.short }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the manifest list, verify both arches present, expose the
  # index digest. This is the most fragile step (#82 reviewer concern #1):
  # if either platform's manifest is missing, the merge silently produces a
  # single-platform image. The verify-both-arches step below makes that a
  # hard fail.
  merge:
    name: Merge into manifest list
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      tag:    ${{ steps.tag.outputs.tag }}

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download per-platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create manifest list and push
        id: merge
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # Source list = name@sha256:<digest> for each per-platform image.
          # `printf '%s '` over the artifact filenames, with an explicit
          # name@sha256: prefix.
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          echo "Sources: $SOURCES"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" $SOURCES
          # Capture the index digest from the freshly-pushed manifest list.
          # `inspect --raw` returns the canonical bytes; their content
          # digest IS the manifest-list digest. Use --format for stability.
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ -z "$DIGEST" || "$DIGEST" == "null" ]]; then
            echo "::error::Could not determine index digest from manifest-list inspect"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Manifest-list digest: $DIGEST"

      - name: Verify both architectures present in manifest list
        run: |
          set -euo pipefail
          INSPECT=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.tag.outputs.tag }}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}')
          echo "Platforms found in manifest list:"
          echo "$INSPECT"
          # Both must be present. `attestation-manifest` entries (with
          # platform "unknown/unknown") are filtered out by grepping for
          # the explicit platform strings.
          if ! grep -qx 'linux/amd64' <<<"$INSPECT"; then
            echo "::error::linux/amd64 manifest is missing from the published index — refusing to ship a single-platform image as multi-arch."
            exit 1
          fi
          if ! grep -qx 'linux/arm64' <<<"$INSPECT"; then
            echo "::error::linux/arm64 manifest is missing from the published index — refusing to ship a single-platform image as multi-arch."
            exit 1
          fi
          echo "✅ Both linux/amd64 and linux/arm64 confirmed in manifest list"

      # ── Option B (v0.7.0+): auto-bump :stable on upstream-only commits ─────
      #
      # Background: previously, :stable was bumped on every push to main, which
      # shipped post-release commits (docs-only PRs, partial Fox features) to
      # all DMG users without an explicit release tag — surfaced by FITB#122
      # where :stable diverged from :v0.5.0 within hours of release. The
      # original guard removed all auto-bump-on-main behavior, deferring :stable
      # entirely to release.yml's tag-driven path.
      #
      # Option B (introduced v0.7.0): the Fox version (VERSION + DMG + exe)
      # tracks Fox-code changes only. Upstream-pin advances ship as container-
      # only updates without forcing a DMG re-download. To preserve FITB#122's
      # protection while enabling Option B, this step ONLY auto-bumps :stable
      # when the merged commit's subject is prefixed with `bump(upstream):` —
      # a convention reserved for upstream-pin advance commits. Fox-code
      # commits never use this prefix, so they fall back to release.yml's
      # tag-driven :stable path exactly as before.
      #
      # See docs/architecture/upstream-overlay.md → "Versioning policy
      # (Option B)" for the operational story + how to create a valid
      # bump(upstream): commit by hand.
      - name: Auto-bump :stable on upstream-only commits (Option B)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # github.event.head_commit.message is multi-line (subject + body);
          # piped through env var (rather than direct ${{ }} interpolation
          # into the bash script) for safe quoting. Read via shell parameter
          # expansion to isolate the subject line — that's where the Option B
          # marker lives.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Subject = first line of the commit message. Avoids needing a
          # `git log` call (the merge job has no actions/checkout — it works
          # entirely from downloaded per-arch digests, so `git` is unusable).
          MSG="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$MSG" =~ ^bump\(upstream\): ]]; then
              INPUT_DIGEST="${{ steps.merge.outputs.digest }}"
              echo "Commit subject matches Option B upstream-bump convention:"
              echo "  $MSG"
              echo "Bumping :stable from the :latest manifest list ($INPUT_DIGEST)"
              docker buildx imagetools create \
                -t "${IMAGE}:stable" \
                "${IMAGE}@${INPUT_DIGEST}"
              # Verify both arches survived the re-tag (defensive — FITB#82).
              docker buildx imagetools inspect "${IMAGE}:stable" \
                --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}' \
                | grep -qx 'linux/amd64'
              docker buildx imagetools inspect "${IMAGE}:stable" \
                --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}' \
                | grep -qx 'linux/arm64'
              # imagetools create rebuilds the manifest list and assigns it a
              # NEW index digest (the contents are bit-identical but the
              # operation creates a new manifest blob). Re-read so the log
              # shows the actual digest :stable points at after the operation,
              # not the input digest (FITB v0.7.1 cosmetic fix).
              STABLE_DIGEST=$(docker buildx imagetools inspect "${IMAGE}:stable" \
                --format '{{json .Manifest}}' | jq -r '.digest')
              echo "✅ :stable now points at $STABLE_DIGEST (both arches confirmed; input was $INPUT_DIGEST)"
          else
              echo "Skipping :stable auto-bump — commit subject is not a 'bump(upstream):' prefix:"
              echo "  $MSG"
              echo "(This is the FITB#122 protection: only Option B upstream-only commits move :stable on main pushes; Fox-code releases move :stable via release.yml on tag push.)"
          fi
      # Do NOT add an unconditional :stable re-tag here. The conditional above
      # is the entire Option B contract; making it unconditional would re-open
      # FITB#122's bug.

  # ── Pull the published manifest by INDEX digest on each platform's
  # native runner and run the smoke test. This proves the digest pin
  # contract release.yml depends on still works (#82 reviewer concern #2):
  # `docker pull name@<index-digest>` auto-selects the host platform's
  # child manifest. Each smoke also validates `/health` body contains
  # `"status": "ok"` — not just HTTP 200 — to catch a #57-style mismatch.
  smoke:
    name: Smoke (${{ matrix.platform.short }})
    needs: [merge]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,    short: amd64, expected: amd64 }
          - { runner: ubuntu-24.04-arm, short: arm64, expected: arm64 }
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image by INDEX digest (verifies digest-pin compatibility)
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          # Confirm the registry served the matching child manifest for
          # this runner's architecture — that's exactly what release.yml
          # relies on (`docker pull "$IMG@$DIGEST"` on amd64 must yield
          # an amd64 image without --platform).
          ARCH=$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{.Architecture}}')
          if [[ "$ARCH" != "${{ matrix.platform.expected }}" ]]; then
            echo "::error::Pulling index digest on ${{ matrix.platform.short }} runner did not auto-select ${{ matrix.platform.expected }} (got: $ARCH). release.yml's pull-by-digest pattern would break."
            exit 1
          fi
          echo "✅ Index-digest pull resolved to $ARCH on ${{ matrix.platform.short }} runner"

      - name: Start container
        id: start
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          docker run -d \
            --name test-fox \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            --sysctl net.ipv4.ip_forward=1 \
            -p 127.0.0.1:8787:8787 \
            "${IMAGE}@${DIGEST}"
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Wait for /health to return 200 with healthy body
        # Validates BOTH the HTTP status AND that the body contains
        # `"status": "ok"`. v0.2.0 (#57) showed status-code-only checks
        # can mask body-shape divergence — don't repeat that.
        id: health
        env:
          START_EPOCH: ${{ steps.start.outputs.start_epoch }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            RESP=$(curl -fsS http://localhost:8787/health 2>/dev/null) || RESP=""
            if [[ -n "$RESP" ]] && echo "$RESP" | grep -q '"status": "ok"'; then
              ELAPSED=$(( $(date +%s) - START_EPOCH ))
              echo "startup_seconds=$ELAPSED" >> "$GITHUB_OUTPUT"
              echo "✅ /health returned 200 with healthy body on attempt $i (${ELAPSED}s)"
              echo "Body: $RESP"
              exit 0
            fi
            if ! docker inspect test-fox --format '{{.State.Running}}' | grep -q true; then
              echo "::error::Container exited unexpectedly on ${{ matrix.platform.short }}"
              docker logs test-fox
              exit 1
            fi
            echo "  Waiting on ${{ matrix.platform.short }}... ($i/36)"
            sleep 5
          done
          echo "::error::Container did not return a healthy /health body within 3 minutes on ${{ matrix.platform.short }}"
          docker logs test-fox
          exit 1

      - name: Startup time regression gate (#429)
        env:
          STARTUP_SECONDS: ${{ steps.health.outputs.startup_seconds }}
          ARCH: ${{ matrix.platform.short }}
          DIGEST: ${{ needs.merge.outputs.digest }}
          # Thresholds in seconds. Set conservatively until baseline data
          # from ~10 CI runs establishes p50/p95. Then tighten to
          # p95 * 1.20 per the SLO definition.
          STARTUP_WARN_THRESHOLD: '45'
          STARTUP_FAIL_THRESHOLD: '90'
        run: |
          set -euo pipefail
          if [[ -z "$STARTUP_SECONDS" ]]; then
            echo "::error::No startup time recorded — health step may have failed"
            exit 1
          fi
          echo "Startup time on ${ARCH}: ${STARTUP_SECONDS}s (warn=${STARTUP_WARN_THRESHOLD}s, fail=${STARTUP_FAIL_THRESHOLD}s)"

          if (( STARTUP_SECONDS <= STARTUP_WARN_THRESHOLD )); then
            echo "::notice title=startup-time-${ARCH}::Container started in ${STARTUP_SECONDS}s on ${ARCH} (within ${STARTUP_WARN_THRESHOLD}s warn threshold)"
            exit 0
          fi

          if (( STARTUP_SECONDS <= STARTUP_FAIL_THRESHOLD )); then
            echo "::warning title=startup-time-${ARCH}::Container started in ${STARTUP_SECONDS}s on ${ARCH} — above ${STARTUP_WARN_THRESHOLD}s warn threshold (hard limit: ${STARTUP_FAIL_THRESHOLD}s)"
            exit 0
          fi

          # Over hard threshold — retry once (flake resistance).
          # Downstream steps (pip lock, container logs, stop) operate on
          # whichever test-fox instance is running — the retry container
          # if this path fires.
          echo "::warning title=startup-time-${ARCH}::First attempt: ${STARTUP_SECONDS}s exceeds ${STARTUP_FAIL_THRESHOLD}s hard threshold — retrying"
          docker rm -f test-fox || true
          sleep 1

          RETRY_START=$(date +%s)
          docker run -d \
            --name test-fox \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            --sysctl net.ipv4.ip_forward=1 \
            -p 127.0.0.1:8787:8787 \
            "${IMAGE}@${DIGEST}"

          for i in $(seq 1 36); do
            RESP=$(curl -fsS http://localhost:8787/health 2>/dev/null) || RESP=""
            if [[ -n "$RESP" ]] && echo "$RESP" | grep -q '"status": "ok"'; then
              RETRY_ELAPSED=$(( $(date +%s) - RETRY_START ))
              echo "Retry startup time on ${ARCH}: ${RETRY_ELAPSED}s"
              if (( RETRY_ELAPSED <= STARTUP_FAIL_THRESHOLD )); then
                echo "::warning title=startup-time-${ARCH}::Retry passed: ${RETRY_ELAPSED}s (first attempt was ${STARTUP_SECONDS}s — likely cold-cache flake)"
                exit 0
              fi
              echo "::error title=startup-time-${ARCH}::Startup regression on ${ARCH}: both attempts exceeded ${STARTUP_FAIL_THRESHOLD}s (first: ${STARTUP_SECONDS}s, retry: ${RETRY_ELAPSED}s)"
              exit 1
            fi
            if ! docker inspect test-fox --format '{{.State.Running}}' | grep -q true; then
              echo "::error::Container exited during retry on ${ARCH}"
              docker logs test-fox
              exit 1
            fi
            sleep 5
          done
          echo "::error::Container did not become healthy during retry on ${ARCH}"
          docker logs test-fox
          exit 1

      - name: Embeddings POST (embed-server 768-dim contract)
        # embed-server binds 127.0.0.1:8644 INSIDE the container (the only
        # published port is 8787), so a host-side curl can never connect —
        # exec into the container, same pattern as the pip-lock step below.
        # Retries cover the first-request model load (and the
        # --sleep-idle-seconds wake path). One step, both platform legs.
        run: |
          set -euo pipefail
          RESP=""
          for i in $(seq 1 12); do
            RESP=$(docker exec test-fox curl -fsS -X POST http://127.0.0.1:8644/v1/embeddings \
              -H 'Content-Type: application/json' \
              -d '{"input":"fox smoke embedding","model":"nomic-embed-text-v1.5"}' 2>/dev/null) || RESP=""
            if [[ -n "$RESP" ]]; then
              break
            fi
            echo "  embed-server not answering yet on ${{ matrix.platform.short }}... ($i/12)"
            sleep 5
          done
          if [[ -z "$RESP" ]]; then
            echo "::error::embed-server did not answer POST /v1/embeddings on 127.0.0.1:8644 (${{ matrix.platform.short }})"
            docker exec test-fox sh -c 'tail -n 50 /data/logs/embed-server.err 2>/dev/null' || true
            exit 1
          fi
          # curl -f already guarantees HTTP 200; now assert the vector shape.
          LEN=$(echo "$RESP" | jq -r '.data[0].embedding | length')
          if [[ "$LEN" != "768" ]]; then
            echo "::error::expected a 768-length embedding vector, got length: ${LEN}"
            echo "$RESP" | head -c 500
            exit 1
          fi
          echo "✅ /v1/embeddings returned HTTP 200 with a 768-dim vector on ${{ matrix.platform.short }}"

      - name: Verify pip lock consistency
        if: matrix.platform.short == 'amd64'
        run: |
          set -euo pipefail
          # Compare the committed lock file (baked into the image at build time)
          # against the live pip freeze. Uses docker cp to avoid network fetch
          # issues on fork PRs.
          docker cp test-fox:/app/requirements.lock /tmp/lock-from-image.txt
          grep -v '^#' /tmp/lock-from-image.txt | grep -v '^$' | sort > /tmp/lock.txt
          docker exec test-fox pip freeze --exclude-editable 2>/dev/null | sort > /tmp/freeze.txt
          if ! diff -u /tmp/lock.txt /tmp/freeze.txt; then
            echo "::warning::pip freeze differs from requirements.lock — regenerate with: docker run --rm --entrypoint pip <image> freeze --exclude-editable | sort > packages/integration/requirements.lock"
          else
            echo "pip freeze matches requirements.lock"
          fi

      - name: Container logs (always — debug)
        if: always()
        run: docker logs test-fox 2>&1 || true

      - name: Stop container
        if: always()
        run: docker stop test-fox || true

  # ── Per-PR image self-test (design §g.3). Runs the PR-built image and execs
  # into it:
  #   phase A — _WELL_KNOWN/_POOL_ID_MAP sync assertions against the real
  #     hermes_cli import surface + the §e protobuf 6.33.6 upb wire probe
  #     (packages/fox-overlay/tests/image_selftest_phase_a.py, baked into the
  #     image at /app/fox-overlay). HARD-FAILS on drift — these assertions
  #     cannot run in validate-overlay (no hermes-agent on PYTHONPATH, no
  #     httpx), so this job is their only per-PR home.
  #   phase B — REAL memory activation with a stub key (§g.3/§1.3): first the
  #     preflight module must produce exactly one `memory: READY|OFF|ERROR`
  #     line and seed a valid state.json (first-run onboarding state
  #     tolerated); then image_selftest_phase_b.py exercises the real plugin
  #     path — _get_memory() constructs a Memory whose LLM is PinnedOpenAILLM
  #     with the client base_url pinned to the resolved OpenRouter URL despite
  #     the exported OPENROUTER_API_KEY hijack condition, the mem0 version
  #     tripwire is asserted ARMED (monkeypatched 2.1.0 → MemoryUnavailable/
  #     error), and one search-only op runs through the local embed-server on
  #     :8644. A mem0 pin bump cannot stay latent past this per-PR gate.
  image-selftest:
    name: Image self-test
    needs: [merge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          docker run -d \
            --name selftest-fox \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            --sysctl net.ipv4.ip_forward=1 \
            -p 127.0.0.1:8787:8787 \
            "${IMAGE}@${DIGEST}"

      - name: Wait for /health (entrypoint must finish app setup first)
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            RESP=$(curl -fsS http://localhost:8787/health 2>/dev/null) || RESP=""
            if [[ -n "$RESP" ]] && echo "$RESP" | grep -q '"status": "ok"'; then
              echo "✅ /health healthy on attempt $i"
              exit 0
            fi
            if ! docker inspect selftest-fox --format '{{.State.Running}}' | grep -q true; then
              echo "::error::Container exited unexpectedly during image-selftest"
              docker logs selftest-fox
              exit 1
            fi
            echo "  Waiting for /health... ($i/36)"
            sleep 5
          done
          echo "::error::Container did not become healthy within 3 minutes"
          docker logs selftest-fox
          exit 1

      - name: "Phase A: _WELL_KNOWN/_POOL_ID_MAP sync assertions (in-image, hard-fail)"
        run: |
          set -euo pipefail
          docker exec selftest-fox \
            python3 /app/fox-overlay/tests/image_selftest_phase_a.py

      - name: "Phase B: real memory activation with a stub key"
        run: |
          set -euo pipefail
          # Part 1 — preflight/state.json seed path. The stub key is a
          # syntactically-usable placeholder — preflight resolution is static
          # (no provider round trip), so no real secret is needed. Run as the
          # runtime user (preflight refuses uid 0).
          OUT=$(docker exec \
            -u foxinthebox \
            -e HOME=/app \
            -e HERMES_HOME=/data/data/hermes \
            -e PYTHONPATH=/data/apps/hermes-agent \
            -e MEM0_TELEMETRY=False \
            -e OPENROUTER_API_KEY=sk-or-selftest-stub-key \
            selftest-fox python3 -m plugins.memory.mem0_oss.preflight)
          echo "$OUT"
          LINES=$(echo "$OUT" | grep -cE '^memory: (READY|OFF|ERROR)' || true)
          if [[ "$LINES" != "1" ]]; then
            echo "::error::preflight must print exactly one 'memory: READY|OFF|ERROR' line (got ${LINES})"
            exit 1
          fi
          # state.json must exist and carry a valid status. First-run
          # onboarding state is tolerated: ready, off, and error are all
          # acceptable — the assertion is that the seed path works.
          docker exec -i selftest-fox python3 - <<'PY'
          import glob
          import json
          import sys

          paths = sorted(glob.glob("/data/data/hermes/**/state.json", recursive=True))
          if not paths:
              print("FAIL: preflight did not seed a state.json under /data/data/hermes", file=sys.stderr)
              sys.exit(1)
          with open(paths[0], encoding="utf-8") as fh:
              state = json.load(fh)
          status = state.get("status")
          if status not in ("ready", "off", "error"):
              print(f"FAIL: state.json status must be ready|off|error, got: {status!r} ({paths[0]})", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {paths[0]} status={status}")
          PY
          echo "✅ preflight/state.json path verified"

          # Part 2 — real activation (design §g.3/§1.3): _get_memory() with
          # the stub OPENROUTER_API_KEY doubling as the hijack condition.
          # Asserts PinnedOpenAILLM type, pinned client base_url, armed
          # version tripwire, and a search-only op through embed-server
          # :8644. The stub key is never sent anywhere — search embeds
          # locally and never calls the fact-extraction LLM.
          docker exec \
            -u foxinthebox \
            -e HOME=/app \
            -e HERMES_HOME=/data/data/hermes \
            -e PYTHONPATH=/data/apps/hermes-agent \
            -e MEM0_TELEMETRY=False \
            -e OPENROUTER_API_KEY=sk-or-selftest-stub-key \
            selftest-fox python3 /app/fox-overlay/tests/image_selftest_phase_b.py
          echo "✅ real memory activation verified (pinned LLM, armed tripwire, local search op)"

      - name: Container logs (always — debug)
        if: always()
        run: docker logs selftest-fox 2>&1 || true

      - name: Stop container
        if: always()
        run: docker stop selftest-fox || true
