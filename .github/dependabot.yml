version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Single npm scope for the whole pnpm workspace. The root pnpm-lock.yaml
  # already resolves every workspace member (packages/electron, qa/playwright),
  # so this one scope covers them all in ONE grouped PR per run. The separate
  # /packages/electron and /qa/playwright scopes were removed (#856): they
  # re-scanned member manifests the root scope already owns, so each run
  # produced 2-3 PRs racing to edit the same package.json lines.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-deps:
        patterns: ["*"]
        # electron stays out of grouped bumps: a grouped PR once changed
        # packages/electron/package.json to a new electron MAJOR while
        # regenerating only the pnpm lockfile (#788 -> #806 incident),
        # silently promoting a runtime major and breaking npm ci.
        # Ungrouped, an electron update arrives as its own clearly-named
        # PR that can be held for the packaged-smoke arc (#750/#802
        # pattern). electron-builder is excluded for the same reason:
        # packaging breakage is invisible to PR CI (no job builds
        # installers) and surfaces only at release time. These excludes
        # must stay on the workspace-wide scope so the electron manifest
        # is still held here now that the per-directory scope is gone.
        #
        # By design (#861), packages/electron/package-lock.json has NO
        # dependabot version-update coverage: the electron excludes above hold
        # its manifest, and the per-directory npm scope was removed in #856.
        # Its CVE coverage is the OSV scan in electron-lock-audit.yml (#861),
        # the permanent transitive-security control for that lockfile.
        exclude-patterns: ["electron", "electron-builder"]
    ignore:
      # js-yaml is deliberately held at 4.x on the root pnpm tree via
      # pnpm.overrides in package.json (#850, closed won't-fix). Third-party
      # CJS consumers on this tree (electron-builder, electron-updater,
      # dmg-builder, @istanbuljs/load-nyc-config) may break with
      # ERR_REQUIRE_ESM on js-yaml 5.x, and the packaging chain has no PR-CI
      # coverage, so breakage would only surface at release time. The electron
      # npm side runs 5.x separately (its own package-lock). Dependabot kept
      # re-raising the 5.x root bump (#863, then #878) because it does not
      # honor pnpm.overrides; ignore the major so it stops. Minor/patch 4.x
      # security bumps are still allowed. Revert if the CJS consumers confirm
      # dual-CJS+ESM support and the split is retired.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /packages/fox-overlay
    schedule:
      interval: weekly
    groups:
      overlay-deps:
        patterns: ["*"]
